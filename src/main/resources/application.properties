spring.application.name=personal-loan-application

# ====================================
# SERVER CONFIG
# ====================================

server.port=8787

# ====================================
# DATABASE CONFIG (POSTGRESQL)
# ====================================

spring.datasource.url=jdbc:postgresql://localhost:5432/loan_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ====================================
# JPA CONFIG
# ====================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional but recommended
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ====================================
# JWT CONFIG
# ====================================

jwt.secret=loanappsecretkeyforjwtsecurityauthentication2026
jwt.expiration=3600000

# ====================================
# RAZORPAY CONFIG
# ====================================

razorpay.key-id=YOUR_RAZORPAY_KEY
razorpay.key-secret=YOUR_RAZORPAY_SECRET

# ====================================
# FILE UPLOAD CONFIG
# ====================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ====================================
# EMAIL CONFIG
# ====================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ====================================
# LOGGING
# ====================================

logging.level.org.springframework.mail=INFO
logging.level.com.loanapp=DEBUG